name: Local Config
version: 1.0.0
schema: v1

models:
  - name: Qwen2.5 Coder 14b (refactor & chat)
    provider: ollama
    model: qwen2.5-coder:14b
    roles:
      - chat
      - edit
      - apply
    # ── УВЕЛИЧЕНИЕ ОКНА КОНТЕНСТА ───────────────────────────────────────────
    contextLength: 16384    # Расширение теперь разрешит передавать файлы до ~60 Кб
    completionOptions:
      temperature: 0.1
      topP: 0.9
      maxTokens: 4096      # Размер максимального ответа модели
    # Настройки для самого сервера Ollama
    requestOptions:
      extraBody:
        num_ctx: 16384     # Говорит Ollama выделить память под 16к токенов
    systemMessage: "Ты — ведущий JavaScript-архитектор. Всегда общайся с пользователем на русском языке. Ответы форматируй в виде понятного и чистого Markdown. Не выводи сырой JSON."

  # Правильный конфиг для автодополнения (используем меньшую, быструю модель)
  - name: Qwen2.5 Coder 1.5b (autocomplete)
    provider: ollama
    model: qwen2.5-coder:1.5b-base
    roles:
      - autocomplete

  # Правильный конфиг для эмбеддингов (используем специализированную модель)
  - name: Nomic Embed Text
    provider: ollama
    model: nomic-embed-text
    roles:
      - embed

# ── КАСТОМНЫЕ КОМАНДЫ (SLASH COMMANDS) ──────────────────────────────────────
slashCommands:
  - name: doc
    description: "Автоматически добавить JSDoc-комментарии на русском языке к выделенному коду"
    run: |
      Проанализируй выделенный JavaScript-код. 
      Добавь структурированные JSDoc-комментарии, строго следуя правилам проекта из файла `.continue/rules/03-generate-jsdoc.md`. 
      Все текстовые описания, пояснения к параметрам и возвращаемым значениям в комментариях пиши исключительно на русском языке. 
      Сам исполняемый JavaScript-код не изменяй.
  - name: readme
    description: "Сгенерировать или обновить файл README.md на русском языке на основе исходного кода папки src"
    run: |
      Используя предоставленный контекст исходного кода из папки `./src` (включая JSDoc-комментарии, если они есть), 
      сгенерируй структурированное техническое описание и инструкцию по применению для этой библиотеки (файл README.md).
      Строго следуй структуре и правилам оформления из файла проекта `.continue/rules/02-generate-readme.md`.
      Весь текст документации пиши исключительно на грамотном русском языке.
  - name: examples
    description: "Создать файл README_CODE_EXAMPLES_RU.md с практическими примерами использования на русском"
    run: |
      Изучи исходный код в папке `./src` и package.json. 
      На основе их логики сгенерируй полноценное руководство с примерами кода для файла `README_CODE_EXAMPLES_RU.md`.
      Строго следуй структуре, сценариям и правилам оформления из файла `.continue/rules/04-generate-examples.md`.
      Весь текст, включая комментарии внутри кода, пиши исключительно на русском языке.
  - name: test
    description: "Сгенерировать юнит-тесты на основе исходного кода и примеров использования"
    run: |
      Проанализируй исходный код в папке `./src` и ознакомься с примерами использования в файле `README_CODE_EXAMPLES_RU.md`.
      Напиши полноценный набор юнит-тестов, строго следуя правилам из файла `.continue/rules/05-generate-tests.md`.
      Все текстовые описания тестовых сценариев (внутри функций describe и test) пиши исключительно на русском языке.
  - name: split
    description: "Разбить крупный файл на мелкие логические TypeScript-модули"
    run: |
      Проанализируй предоставленный файл. 
      Разработай план декомпозиции этого кода на основе правил из файла `.continue/rules/06-file-splitter.md`.
      Выведи строго Этап 1 (Архитектурный план) на русском языке. 
      Не генерируй код самих функций, пока я не согласую план.

context:
  - provider: codebase
  - provider: tree
