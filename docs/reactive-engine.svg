<?xml version="1.0" encoding="utf-8"?>
<svg
  viewBox="0 0 800 360"
  width="100%"
  height="auto"
  style="display: block; margin: 0 auto; overflow: visible;"
  xmlns="http://w3.org"
  class="reactive-engine-logo-svg"
>
  <defs>
    <!-- Мягкая тень для объемного эффекта букв и металла -->
    <filter id="text-art-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity="0.06" />
    </filter>

    <!-- 🎯 ЭКРАНИРОВАНИЕ CDATA: Защищает фигурные скобки медиа-запросов от падения XML-парсера -->
    <style type="text/css">
      <![CDATA[
        .reactive-engine-logo-svg {
          transform: translateX(8px) scale(0.8);
          width: 100%;
        }
        @keyframes pulse-radar {
          0% { r: 15px; opacity: 0.8; }
          100% { r: 75px; opacity: 0; }
        }
        .radar-circle {
          animation: pulse-radar 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @media (max-width: 420px) {
          .reactive-engine-logo-svg {
            transform: translateX(8px) scale(0.8) !important;
            transform-origin: center center !important;
            margin: 0 auto !important;
          }
        }
      ]]>
    </style>
  </defs>

  <!-- 🎯 СИСТЕМА СТАТИЧНЫХ ГЛОБАЛЬНЫХ ФОНОВЫХ КОЛЕЦ -->
  <circle cx="400" cy="175" r="35" fill="none" stroke="#0162c8" stroke-width="1.5" opacity="0.2" />
  <circle cx="400" cy="175" r="85" fill="none" stroke="#0162c8" stroke-width="1.5" opacity="0.1" />
  <circle cx="400" cy="175" r="145" fill="none" stroke="#0162c8" stroke-width="1" opacity="0.04" />

  <!-- Внешнее акцентное кольцо-нимб вокруг сопла -->
  <circle cx="400" cy="175" r="64" fill="none" stroke="#FF8E53" stroke-width="1.2" opacity="0.25" stroke-dasharray="3, 3" />

  <!-- 🔤 СЛОВО "Reactive" -->
  <text
    x="335"
    y="215"
    font-family="Montserrat, system-ui, -apple-system, sans-serif"
    font-weight="900"
    font-size="115"
    fill="#0162c8"
    text-anchor="end"
    letter-spacing="-0.04em"
    filter="url(#text-art-shadow)"
  >
    Reactive
  </text>

  <!-- 🔤 СЛОВО "Engine" -->
  <text
    x="465"
    y="215"
    font-family="Montserrat, system-ui, -apple-system, sans-serif"
    font-weight="900"
    font-size="115"
    fill="#FF8E53"
    text-anchor="start"
    letter-spacing="-0.02em"
    filter="url(#text-art-shadow)"
  >
    Engine
  </text>

  <!-- ========================================================================= -->
  <!-- 🚀 ЦЕНТР: РЕАКТИВНЫЙ ДВИГАТЕЛЬ (БЕЗ КОНФЛИКТОВ СЕТКИ) -->
  <!-- ========================================================================= -->
  <g id="reactive-engine-core" filter="url(#text-art-shadow)">
